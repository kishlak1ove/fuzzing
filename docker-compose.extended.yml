services:

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - secnet
    restart: unless-stopped
  
  cats:
    build:
      context: ./cats
    image: my-cats:latest
    container_name: cats
    volumes:
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  ffuf:
    build:
      context: ./ffuf
    image: my-ffuf:latest
    container_name: ffuf
    volumes:
      - ./seeds:/seeds
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  wfuzz:
    build:
      context: ./wfuzz
    image: my-wfuzz:latest
    container_name: wfuzz
    volumes:
      - ./seeds:/seeds
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  feroxbuster:
    build:
      context: ./feroxbuster
    image: my-feroxbuster:latest
    container_name: feroxbuster
    volumes:
      - ./seeds:/seeds
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  schemathesis:
    image: schemathesis/schemathesis:stable
    container_name: schemathesis
    volumes:
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  katana:
    image: projectdiscovery/katana:latest
    container_name: katana
    volumes:
      - ./seeds:/seeds
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  arjun:
    build:
      context: ./arjun
    image: my-arjun:latest
    container_name: arjun
    volumes:
      - ./seeds:/seeds
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]
  
  dashboard:
    build:
      context: ./dashboard
    container_name: dashboard
    ports:
      - "127.0.0.1:8501:8501"
    extra_hosts:                            
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./seeds:/seeds
      - ./results:/results
      - ./dashboard:/app 
    networks:
      - secnet
    restart: unless-stopped
  
  linkfinder:
    build:
      context: ./linkfinder
    image: my-linkfinder:latest
    container_name: linkfinder
    volumes:
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  puppeteer:
    build:
      context: ./puppeteer
    image: my-puppeteer:latest
    container_name: puppeteer
    volumes:
      - ./results:/results
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  mongodb:
    image: mongo:7
    container_name: mongodb
    volumes:
      - ./mongodb_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - secnet
    restart: unless-stopped

  graphql-tools:
    build:
      context: ./graphql-tools
    image: my-graphql-tools:latest
    container_name: graphql-tools
    volumes:
      - ./results:/results
      - ./seeds:/seeds
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: nuclei
    volumes:
      - ./results:/results
      - ./seeds:/seeds
      - ./nuclei-templates:/root/nuclei-templates  # Сохраняем шаблоны между перезапусками
    networks:
      - secnet
    entrypoint: ["tail", "-f", "/dev/null"]

networks:
  secnet:
    driver: bridge